[package]
name = "claude-usage-tray"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6.0.0"
jiff = "0.2.35"
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
notify-rust = "4.18.0"
serde_json = "1.0.151"
tiny-skia = "0.12.0"
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde", "std"] }
# Same zbus ksni already brings in (its `async-io` feature enables that
# backend); used only for the desktop portal's color-scheme setting.
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
