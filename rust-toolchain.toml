# Every build, local and CI, uses exactly this toolchain; rustup reads this
# file on its own. Bump it deliberately, in its own change, after checking that
# `cargo fmt --check`, clippy and the tests still pass on the new version.
[toolchain]
channel = "1.98.1"
# No offline documentation: nothing here reads it, and CI installs faster.
profile = "minimal"
components = ["clippy", "rustfmt"]
