name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build, test and lint (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No system dependencies are installed on purpose: this crate is pure
      # Rust with zero C dependencies (zbus speaks D-Bus over a socket, no
      # libdbus; tiny-skia is pure Rust; no GTK, no OpenSSL).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  check-macos:
    name: Build, test and lint (macos)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Also no system dependencies: the macOS backend is AppKit through
      # tray-icon/muda/tao, all of which bind the system frameworks that ship
      # with the Xcode command line tools the runner already has.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos

      - name: Build
        run: cargo build --locked

      # The portable core's tests are the same ones the Linux job runs; what
      # this adds is that they run against the macOS backend's `platform`
      # module, including the LaunchAgent tests.
      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Convenience artifact so branch builds can be hand-tested on a real
      # Mac before any release exists. Apple Silicon only (the runner's
      # native arch); unsigned, so testers clear quarantine with xattr.
      - name: Build release binary
        run: cargo build --release --locked

      - name: Upload macOS binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-usage-tray-darwin-arm64
          path: target/release/claude-usage-tray
          retention-days: 7

      # The bundle is the interesting half to hand-test: only inside one does
      # the tray get UNUserNotificationCenter notifications, so a branch build
      # that assembles and signs cleanly here is what proves the script before
      # a release ever runs it.
      - name: Assemble the app bundle
        run: sh scripts/make-app-bundle.sh target/release/claude-usage-tray 0.0.0-ci dist

      # `make-app-bundle.sh` already verifies its own signature; this repeats
      # it standalone so a broken bundle fails the job on its own line, and
      # `--strict` is what catches a bundle whose contents drifted from what
      # was signed.
      - name: Verify the ad-hoc signature
        run: codesign --verify --strict --verbose=2 "dist/Claude Usage Tray.app"

      # `ditto`, not `zip`: it is the macOS-native archiver and the only one
      # that preserves the bundle's resource forks and extended attributes,
      # including the signature. `--keepParent` keeps the `.app` directory
      # itself inside the archive rather than unpacking its contents loose.
      - name: Zip the app bundle
        run: ditto -c -k --keepParent "dist/Claude Usage Tray.app" dist/claude-usage-tray-darwin-arm64-app.zip

      - name: Upload macOS app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-usage-tray-darwin-arm64-app
          path: dist/claude-usage-tray-darwin-arm64-app.zip
          retention-days: 7
          if-no-files-found: error
