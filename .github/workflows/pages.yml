name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/build-website.mjs"
      - ".github/workflows/pages.yml"
  # After a release finishes uploading its files, so the version and download
  # links point at the new one.
  workflow_run:
    workflows: [Release]
    types: [completed]
  # Once a day, to keep the download count current.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish website/ to GitHub Pages
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Copies website/ into _site/ with the latest version and download count
      # written in. No dependencies to install.
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-website.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
