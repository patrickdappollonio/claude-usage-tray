name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-release:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_version.outputs.value }}
      npm_tag: ${{ steps.npm_dist_tag.outputs.value }}
    steps:
      - name: Determine release version
        id: release_version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "Failed to extract version from ${{ github.event.release.tag_name }}"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine npm dist tag
        id: npm_dist_tag
        env:
          VERSION: ${{ steps.release_version.outputs.value }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            echo "value=next" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build linux/${{ matrix.goarch }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            goarch: amd64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            goarch: arm64

    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      # Native runners per architecture, so there is no cross-compilation and
      # no Docker: the crate is pure Rust with zero C dependencies, and the
      # musl targets link fully static.
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # cargo-edit's `set-version` updates Cargo.toml *and* Cargo.lock in one
      # step, which a bare `sed` on Cargo.toml would not do (it would leave the
      # lockfile stale and make `--locked` builds fail).
      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      - name: Set version from tag
        run: cargo set-version "$VERSION"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # The release profile sets `strip = true`; this is belt and braces for
      # any debug sections the linker leaves behind.
      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/claude-usage-tray

      - name: Verify the binary is statically linked
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release/claude-usage-tray
          file "$BIN"
          if ldd "$BIN" 2>&1 | grep -qv 'statically linked\|not a dynamic executable'; then
            echo "Binary is not statically linked:"
            ldd "$BIN"
            exit 1
          fi

      - name: Build tarball
        run: |
          set -euo pipefail
          STAGE="claude-usage-tray_${VERSION}_linux_${{ matrix.goarch }}"
          mkdir -p "dist/$STAGE"
          cp target/${{ matrix.target }}/release/claude-usage-tray "dist/$STAGE/"
          cp LICENSE README.md "dist/$STAGE/"
          tar czf "dist/${STAGE}.tar.gz" -C "dist/$STAGE" .
          rm -rf "dist/$STAGE"

      - name: Install nfpm
        run: |
          set -euo pipefail
          NFPM_VERSION=2.47.0
          case "${{ matrix.goarch }}" in
            amd64) NFPM_ARCH=x86_64 ;;
            arm64) NFPM_ARCH=arm64 ;;
          esac
          curl -sSfL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${NFPM_ARCH}.tar.gz"
          tar xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Build packages
        env:
          ARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          # nfpm does not expand env vars inside contents[].src, so stage the
          # binary at the fixed path nfpm.yaml refers to.
          mkdir -p dist/pkgroot
          cp target/${{ matrix.target }}/release/claude-usage-tray dist/pkgroot/
          BASE="dist/claude-usage-tray_${VERSION}_linux_${{ matrix.goarch }}"
          nfpm package -f nfpm.yaml -p deb       -t "${BASE}.deb"
          nfpm package -f nfpm.yaml -p rpm       -t "${BASE}.rpm"
          nfpm package -f nfpm.yaml -p apk       -t "${BASE}.apk"
          nfpm package -f nfpm.yaml -p archlinux -t "${BASE}.pkg.tar.zst"
          ls -la dist

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/claude-usage-tray_*

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.goarch }}
          path: dist/claude-usage-tray_${{ needs.prepare-release.outputs.version }}_linux_${{ matrix.goarch }}.tar.gz
          retention-days: 1
          if-no-files-found: error

  build-darwin:
    name: Build darwin/${{ matrix.goarch }}
    needs: prepare-release
    # One runner builds both: an Apple Silicon macOS runner is a first-class
    # cross-compilation host for x86_64 Macs (the SDK ships both slices), so
    # there is no second runner and no cross toolchain to install.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            goarch: arm64
          - target: x86_64-apple-darwin
            goarch: amd64

    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      - name: Set version from tag
        run: cargo set-version "$VERSION"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # macOS `strip` needs `-x` on a Mach-O binary: without it, it strips
      # symbols the dynamic linker still needs.
      - name: Strip binary
        run: strip -x target/${{ matrix.target }}/release/claude-usage-tray

      # Signing and notarization are opt-in on the presence of the secrets, so
      # forks and any secretless run still produce ad-hoc artifacts instead of
      # failing. The check has to go through a step, not `if: secrets...`:
      # "Secrets cannot be directly referenced in `if:` conditionals. Instead,
      # consider setting secrets as job-level environment variables, then
      # referencing the environment variables to conditionally run steps in the
      # job."
      # https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/use-secrets
      # The secrets are scoped to the individual steps that need them rather
      # than to the whole job, so no other step (or action) can see them.
      - name: Check for Apple signing credentials
        id: signing
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERT_P12}" ]; then
            echo "No APPLE_CERT_P12 secret: building ad-hoc signed, unnotarized artifacts."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Half-configured is a mistake, not a fallback: if the certificate is
          # there, everything notarization needs has to be there too, or the
          # release would quietly ship artifacts Gatekeeper rejects.
          missing=""
          for name in APPLE_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "APPLE_CERT_P12 is set but these secrets are empty:$missing"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # The documented recipe for getting a certificate onto a runner:
      # https://docs.github.com/en/actions/how-tos/deploy/deploy-to-third-party-platforms/sign-xcode-applications
      # A throwaway keychain with a throwaway password, unlocked long enough for
      # the job, added to the search list so `codesign` finds the identity
      # without prompting, and deleted again in the cleanup step below.
      - name: Install the Developer ID certificate
        id: identity
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: 86XS8MEDVM
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          # Never a repository secret: the keychain is created, used and
          # destroyed inside this one job, so a random password is strictly
          # better than a stored one.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo -n "$APPLE_CERT_P12" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # `-T /usr/bin/codesign` rather than `-A`: only codesign (and
          # security, which reads the identity list) may use the private key,
          # instead of every program on the machine.
          security import "$CERT_PATH" -P "$APPLE_CERT_PASSWORD" \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this the first codesign call would block on a GUI prompt
          # asking to allow access to the key, which never comes on a runner.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          # Discover the identity instead of hardcoding its name, and sign by
          # its SHA-1 hash: a name can match more than one certificate, a hash
          # cannot.
          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          LINE="$(printf '%s\n' "$IDENTITIES" | grep 'Developer ID Application' | head -n 1 || true)"
          if [ -z "$LINE" ]; then
            echo "No 'Developer ID Application' identity in the imported certificate:"
            printf '%s\n' "$IDENTITIES"
            exit 1
          fi
          case "$LINE" in
            *"$APPLE_TEAM_ID"*) ;;
            *)
              echo "Identity does not belong to team $APPLE_TEAM_ID: $LINE"
              exit 1
              ;;
          esac
          echo "Signing with: $LINE"
          echo "hash=$(printf '%s\n' "$LINE" | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # The bare binary that goes into the tarball (and from there into
      # Homebrew and npm), signed before it is copied anywhere. `-i` gives
      # non-bundled code an explicit identifier instead of one derived from the
      # file name, and `--timestamp` plus `--options runtime` are what the
      # notary service requires; see Apple's signing recipe at
      # https://developer.apple.com/forums/thread/701514
      - name: Sign the binary
        if: steps.signing.outputs.enabled == 'true'
        env:
          SIGN_IDENTITY: ${{ steps.identity.outputs.hash }}
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/claude-usage-tray"
          codesign --force --timestamp --options runtime \
            -i com.patrickdappollonio.claude-usage-tray \
            -s "$SIGN_IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

      - name: Build tarball
        run: |
          set -euo pipefail
          STAGE="claude-usage-tray_${VERSION}_darwin_${{ matrix.goarch }}"
          mkdir -p "dist/$STAGE"
          cp target/${{ matrix.target }}/release/claude-usage-tray "dist/$STAGE/"
          cp LICENSE README.md "dist/$STAGE/"
          tar czf "dist/${STAGE}.tar.gz" -C "dist/$STAGE" .
          rm -rf "dist/$STAGE"

      # The recommended macOS download: a real `.app`, which is what gives the
      # tray a bundle identity and therefore modern Notification Center
      # notifications. The tarball above stays exactly as it was, and so does
      # everything built from it (Homebrew, npm) — a bare binary is still fully
      # supported, only its notifications are best-effort.
      - name: Build the app bundle
        env:
          # Empty when there are no secrets, and the script's own default ("-",
          # ad hoc) takes over.
          SIGN_IDENTITY: ${{ steps.identity.outputs.hash }}
        run: |
          set -euo pipefail
          sh scripts/make-app-bundle.sh \
            "target/${{ matrix.target }}/release/claude-usage-tray" "$VERSION" dist/app

      # One submission covers both downloads. The notary service scans every
      # item in the archive, so the bundle and the tarball's bare binary go up
      # together and there is only one wait.
      #
      # Only the `.app` gets a stapled ticket. A bare Mach-O binary has nowhere
      # to keep one ("you can notarize a ZIP archive, but you can't staple to
      # it" — https://developer.apple.com/documentation/security/customizing-the-notarization-workflow),
      # so the binary relies on Gatekeeper's online check, which passes because
      # its code directory hash is now registered with Apple.
      - name: Notarize and staple
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          STAGE="$RUNNER_TEMP/notarize"
          ZIP="$RUNNER_TEMP/notarize.zip"
          echo -n "$APPLE_API_KEY_P8" | base64 --decode -o "$KEY_PATH"

          rm -rf "$STAGE" "$ZIP"
          mkdir -p "$STAGE"
          ditto "target/${{ matrix.target }}/release/claude-usage-tray" \
            "$STAGE/claude-usage-tray"
          ditto "dist/app/Claude Usage Tray.app" "$STAGE/Claude Usage Tray.app"
          # No `--keepParent`: both items sit at the root of the archive.
          ditto -c -k "$STAGE" "$ZIP"

          # `--wait` blocks until Apple reaches a verdict instead of returning a
          # submission id to poll by hand.
          set +e
          xcrun notarytool submit "$ZIP" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait --output-format json > "$RUNNER_TEMP/notarize.json"
          submit_status=$?
          set -e
          cat "$RUNNER_TEMP/notarize.json"

          # The verdict is read out of the JSON rather than trusted to the exit
          # code, so an "Invalid" result can never be mistaken for success.
          # Unparseable output (a network or credentials failure before any
          # verdict) leaves both fields empty, which fails below just the same.
          verdict="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("id","-"), d.get("status","-"))' \
            "$RUNNER_TEMP/notarize.json" 2>/dev/null || echo '- -')"
          read -r id status <<<"$verdict"
          if [ "$status" != "Accepted" ]; then
            echo "Notarization failed: status=$status, notarytool exit=$submit_status"
            if [ "$id" != "-" ] && [ -n "$id" ]; then
              echo "Notary log:"
              xcrun notarytool log "$id" \
                --key "$KEY_PATH" \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER_ID" || true
            fi
            exit 1
          fi

          # `stapler` fetches the ticket Apple issued for this code directory
          # hash and writes it into the bundle, so the app opens on a Mac that
          # is offline or behind a filtered network.
          xcrun stapler staple "dist/app/Claude Usage Tray.app"
          xcrun stapler validate "dist/app/Claude Usage Tray.app"

      # Zipped after stapling, so the ticket ships inside the download.
      # `ditto`, not `zip`: the macOS-native archiver, and the only one that
      # round-trips a bundle's extended attributes and its code signature.
      # `--keepParent` keeps the `.app` itself in the archive so unzipping
      # produces an app, not its loose contents.
      - name: Zip the app bundle
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "dist/app/Claude Usage Tray.app" \
            "dist/claude-usage-tray_${VERSION}_darwin_${{ matrix.goarch }}_app.zip"
          rm -rf dist/app
          ls -la dist

      # No .deb/.rpm/.apk/.pkg equivalents here: nfpm builds Linux packages
      # only, and macOS is served by the app bundle, the tarball, Homebrew and
      # npm.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/claude-usage-tray_*

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-darwin-${{ matrix.goarch }}
          path: dist/claude-usage-tray_${{ needs.prepare-release.outputs.version }}_darwin_${{ matrix.goarch }}.tar.gz
          retention-days: 1
          if-no-files-found: error

      # Last, and unconditional. Everything secret lived in $RUNNER_TEMP, which
      # is outside the workspace and so was never a candidate for upload; this
      # removes it anyway, and takes the keychain with it, whether the job
      # passed or failed.
      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/notarize" "$RUNNER_TEMP/notarize.zip" \
            "$RUNNER_TEMP/notarize.json" "$RUNNER_TEMP/certificate.p12" \
            "$RUNNER_TEMP/notary-key.p8"

  build-npm-package:
    name: Build npm package
    needs: [prepare-release, build, build-darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download release archive artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/artifacts
          merge-multiple: true

      - name: Build npm package
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          ARTIFACTS_DIR: dist/artifacts
        run: node npm/scripts/build_npm_package.mjs

      - name: Upload npm package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist/npm/claude-usage-tray-npm-*.tgz
          retention-days: 1
          if-no-files-found: error

  publish-npm:
    name: Publish npm package
    needs: [prepare-release, build-npm-package]
    if: ${{ needs.build-npm-package.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: "@patrickdappollonio"

      - name: Update npm
        run: npm install -g npm@latest

      - name: Download npm package artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist/npm

      - name: Publish to npm
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          NPM_TAG: ${{ needs.prepare-release.outputs.npm_tag }}
        run: |
          set -euo pipefail
          tarball="dist/npm/claude-usage-tray-npm-${VERSION}.tgz"
          if [[ ! -f "$tarball" ]]; then
            echo "npm tarball $tarball not found"
            exit 1
          fi

          publish_cmd=(npm publish "$tarball" --access public)
          if [[ -n "$NPM_TAG" ]]; then
            publish_cmd+=(--tag "$NPM_TAG")
          fi

          echo "+ ${publish_cmd[*]}"
          "${publish_cmd[@]}"

  checksums:
    name: Publish checksums
    needs: [prepare-release, build, build-darwin, build-npm-package]
    runs-on: ubuntu-latest
    steps:
      - name: Download every release asset and checksum it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p dist && cd dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'claude-usage-tray_*'
          rm -f checksums.txt
          sha256sum claude-usage-tray* | sort -k2 > checksums.txt
          cat checksums.txt
          gh release upload "$TAG" checksums.txt --repo "$GITHUB_REPOSITORY" --clobber
