name: claude-usage-tray
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Patrick D'appollonio <patrickdappollonio@gmail.com>
description: |
  Linux tray icon showing Claude Code 5-hour and weekly usage.
  A StatusNotifierItem tray icon that renders your Claude Code
  subscription usage (the 5-hour session percentage and the 7-day
  weekly percentage) with reset times, read from a local cache file.
  Never reads your credentials. Its only network request is an
  optional daily check for new releases on GitHub, which can be
  turned off.
vendor: Patrick D'appollonio
homepage: https://github.com/patrickdappollonio/claude-usage-tray
license: MIT

contents:
  # nfpm expands environment variables in the metadata fields above, but NOT in
  # `contents[].src`, so the binary is staged at a fixed path before packaging
  # (the release workflow copies it here from the per-target build directory).
  - src: ./dist/pkgroot/claude-usage-tray
    dst: /usr/bin/claude-usage-tray
    file_info:
      mode: 0755

  # Application-menu launcher (KDE, GNOME, XFCE, ...) and its themed icon.
  # Without these the package installs only the binary, and the tray never
  # shows up in the desktop's app launcher.
  # The PNGs are assets/appicon-1024.png resized, e.g.
  #   magick assets/appicon-1024.png -resize 256x256 -strip packaging/linux/icons/claude-usage-tray-256.png
  - src: ./packaging/linux/claude-usage-tray.desktop
    dst: /usr/share/applications/claude-usage-tray.desktop
    file_info:
      mode: 0644

  - src: ./packaging/linux/icons/claude-usage-tray-32.png
    dst: /usr/share/icons/hicolor/32x32/apps/claude-usage-tray.png
    file_info:
      mode: 0644

  - src: ./packaging/linux/icons/claude-usage-tray-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/claude-usage-tray.png
    file_info:
      mode: 0644

  - src: ./packaging/linux/icons/claude-usage-tray-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/claude-usage-tray.png
    file_info:
      mode: 0644

  - src: ./packaging/linux/icons/claude-usage-tray-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/claude-usage-tray.png
    file_info:
      mode: 0644

  - src: ./packaging/linux/icons/claude-usage-tray-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/claude-usage-tray.png
    file_info:
      mode: 0644

  - src: ./packaging/linux/icons/claude-usage-tray-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/claude-usage-tray.png
    file_info:
      mode: 0644

  - src: ./LICENSE
    dst: /usr/share/doc/claude-usage-tray/LICENSE
    file_info:
      mode: 0644
    packager: deb

  - src: ./LICENSE
    dst: /usr/share/licenses/claude-usage-tray/LICENSE
    file_info:
      mode: 0644
    packager: rpm

  - src: ./LICENSE
    dst: /usr/share/licenses/claude-usage-tray/LICENSE
    file_info:
      mode: 0644
    packager: archlinux

  - src: ./LICENSE
    dst: /usr/share/licenses/claude-usage-tray/LICENSE
    file_info:
      mode: 0644
    packager: apk
